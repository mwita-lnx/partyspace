name: Deploy PartySpace

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy PartySpace Application
      env:
        SERVER_HOST: ${{ secrets.SSH_HOST }}
        SERVER_USER: ${{ secrets.SSH_USER }}
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST '
          set -e

          echo "🚀 Starting PartySpace Deployment"

          # Navigate to home directory
          cd /home/ubuntu

          # Clone or update repository
          if [ ! -d "partyspace/.git" ]; then
            echo "📦 Cloning PartySpace repository..."
            git clone https://'"$GITHUB_TOKEN"'@github.com/'"${{ github.repository }}"'.git partyspace
          else
            echo "🔄 Updating PartySpace repository..."
            cd /home/ubuntu/partyspace
            git fetch origin main
            git reset --hard origin/main
          fi

          # Navigate to app directory
          cd /home/ubuntu/partyspace

          # Fix permissions
          sudo chown -R ubuntu:ubuntu /home/ubuntu/partyspace

          # Ensure tamashani-network exists
          docker network inspect tamashani-network >/dev/null 2>&1 || docker network create tamashani-network

          # ZERO-DOWNTIME DOCKER DEPLOYMENT
          echo "🐳 Building PartySpace container..."
          sudo docker compose build --no-cache

          echo "🔄 Starting PartySpace with zero downtime..."
          sudo docker compose up -d --build --force-recreate --remove-orphans

          sudo docker builder prune -a -f
          sudo docker image prune -a -f

          # Show status
          echo "📊 Container status:"
          sudo docker compose ps

          # Cleanup unused images
          echo "🧹 Cleaning unused Docker images..."
          sudo docker image prune -f

          echo "✅ PartySpace deployment complete — NO DOWNTIME 🎉"
        '
