<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Flash</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFE5D9 0%, #D4F1F4 50%, #FFFACD 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2C3E50;
            margin-bottom: 10px;
        }

        .description {
            font-size: 1.2rem;
            color: #7F8C8D;
            margin-bottom: 20px;
        }

        .round-info {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667EEA, #764BA2);
            color: white;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .instruction {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2C3E50;
            margin: 30px 0;
            min-height: 40px;
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .memory-cell {
            aspect-ratio: 1;
            border-radius: 15px;
            background: #F0F0F0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            border: 4px solid transparent;
        }

        .memory-cell.show {
            background: linear-gradient(135deg, #667EEA, #764BA2);
            color: white;
            transform: scale(1.05);
        }

        .memory-cell.clickable:hover {
            transform: scale(1.05);
            border-color: #667EEA;
        }

        .memory-cell.correct {
            background: #2ECC71;
            color: white;
        }

        .memory-cell.wrong {
            background: #E74C3C;
            color: white;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .score {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2C3E50;
            margin-top: 20px;
        }

        .score span {
            color: #667EEA;
            font-size: 2rem;
        }

        .game-over {
            display: none;
            text-align: center;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            font-size: 2.5rem;
            color: #2C3E50;
            margin-bottom: 20px;
        }

        .game-over .final-score {
            font-size: 3rem;
            font-weight: 700;
            color: #667EEA;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 id="title">Memory Flash</h1>
            <p class="description" id="description">Remember the sequence!</p>
            <div class="round-info" id="round-info">Round 1</div>
        </div>

        <div id="game-content">
            <div class="instruction" id="instruction">Watch carefully...</div>

            <div class="memory-grid" id="memory-grid"></div>

            <div class="score">
                Score: <span id="score">0</span>
            </div>
        </div>

        <div class="game-over" id="game-over">
            <h2>Game Over!</h2>
            <div class="final-score" id="final-score">0</div>
            <p>Points earned</p>
        </div>
    </div>

    <script>
        // Get query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');
        const participantId = urlParams.get('participantId');
        const awardId = urlParams.get('awardId');
        const title = urlParams.get('title') || 'Memory Flash';
        const description = urlParams.get('description') || 'Remember the sequence!';

        // Update UI
        document.getElementById('title').textContent = title;
        document.getElementById('description').textContent = description;

        // Game state
        let score = 0;
        let round = 1;
        let sequence = [];
        let playerSequence = [];
        let gameActive = false;
        let startTime = Date.now();

        const gridSize = 9;
        const maxRounds = 10;

        // Create grid
        const grid = document.getElementById('memory-grid');
        const cells = [];

        for (let i = 0; i < gridSize; i++) {
            const cell = document.createElement('div');
            cell.className = 'memory-cell';
            cell.dataset.index = i;
            cell.addEventListener('click', () => handleCellClick(i));
            grid.appendChild(cell);
            cells.push(cell);
        }

        // Start game
        setTimeout(() => {
            startRound();
        }, 1500);

        function startRound() {
            document.getElementById('round-info').textContent = `Round ${round}`;
            document.getElementById('instruction').textContent = 'Watch carefully...';

            // Generate sequence (length = current round + 2)
            sequence = [];
            const sequenceLength = Math.min(round + 2, 7);

            for (let i = 0; i < sequenceLength; i++) {
                let nextCell;
                do {
                    nextCell = Math.floor(Math.random() * gridSize);
                } while (i > 0 && nextCell === sequence[i - 1]); // Avoid consecutive duplicates
                sequence.push(nextCell);
            }

            playerSequence = [];
            showSequence();
        }

        async function showSequence() {
            gameActive = false;

            for (let i = 0; i < sequence.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 600));

                const cellIndex = sequence[i];
                cells[cellIndex].classList.add('show');
                cells[cellIndex].textContent = i + 1;

                await new Promise(resolve => setTimeout(resolve, 800));

                cells[cellIndex].classList.remove('show');
                cells[cellIndex].textContent = '';
            }

            await new Promise(resolve => setTimeout(resolve, 1000));

            document.getElementById('instruction').textContent = 'Now repeat the sequence!';
            gameActive = true;
            cells.forEach(cell => cell.classList.add('clickable'));
        }

        function handleCellClick(index) {
            if (!gameActive) return;

            playerSequence.push(index);
            const currentStep = playerSequence.length - 1;

            if (playerSequence[currentStep] === sequence[currentStep]) {
                // Correct so far
                cells[index].classList.add('correct');
                setTimeout(() => {
                    cells[index].classList.remove('correct');
                }, 300);

                if (playerSequence.length === sequence.length) {
                    // Round complete!
                    gameActive = false;
                    cells.forEach(cell => cell.classList.remove('clickable'));

                    score += round * 10;
                    document.getElementById('score').textContent = score;
                    document.getElementById('instruction').textContent = 'Perfect! 🎉';

                    setTimeout(() => {
                        round++;
                        if (round <= maxRounds) {
                            startRound();
                        } else {
                            endGame();
                        }
                    }, 1500);
                }
            } else {
                // Wrong!
                gameActive = false;
                cells.forEach(cell => cell.classList.remove('clickable'));
                cells[index].classList.add('wrong');

                document.getElementById('instruction').textContent = 'Wrong! Game Over';

                setTimeout(() => {
                    endGame();
                }, 1500);
            }
        }

        async function endGame() {
            const timeSpent = Math.floor((Date.now() - startTime) / 1000);

            document.getElementById('game-content').style.display = 'none';
            document.getElementById('game-over').classList.add('show');
            document.getElementById('final-score').textContent = score;

            // Save score to API
            try {
                const response = await fetch(`/api/rooms/${roomId}/votes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        participantId: participantId,
                        awardId: awardId,
                        answer: score.toString(),
                        timeSpent: timeSpent,
                        isCorrect: true
                    })
                });

                if (response.ok) {
                    console.log('Score saved successfully');

                    // Show results for 2 seconds, then notify parent to move to next
                    setTimeout(() => {
                        window.parent.postMessage({
                            type: 'GAME_COMPLETE',
                            score: score,
                            rounds: round - 1,
                            timeSpent: timeSpent
                        }, '*');
                    }, 2000);
                } else {
                    // Even if save failed, still advance after showing results
                    setTimeout(() => {
                        window.parent.postMessage({
                            type: 'GAME_COMPLETE',
                            score: score
                        }, '*');
                    }, 2000);
                }
            } catch (error) {
                console.error('Error saving score:', error);
                // Even on error, advance after delay
                setTimeout(() => {
                    window.parent.postMessage({
                        type: 'GAME_COMPLETE',
                        score: score
                    }, '*');
                }, 2000);
            }
        }
    </script>
</body>
</html>
