<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Battle</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFE5D9 0%, #D4F1F4 50%, #FFFACD 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2C3E50;
            margin-bottom: 10px;
        }

        .description {
            font-size: 1.2rem;
            color: #7F8C8D;
            margin-bottom: 20px;
        }

        .timer {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #FF6B6B, #FF8C42);
            color: white;
            border-radius: 50px;
            font-size: 2rem;
            font-weight: 700;
            min-width: 100px;
        }

        .timer.warning {
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .tap-zone {
            margin: 30px 0;
            height: 400px;
            background: linear-gradient(135deg, #4ECDC4 0%, #44A8AC 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s;
        }

        .tap-zone:active {
            transform: scale(0.98);
        }

        .tap-instruction {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            text-align: center;
            pointer-events: none;
        }

        .tap-effect {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            from {
                transform: scale(0);
                opacity: 1;
            }
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .score {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2C3E50;
            margin-top: 20px;
        }

        .score span {
            color: #4ECDC4;
            font-size: 3rem;
            display: block;
            margin: 10px 0;
        }

        .game-over {
            display: none;
            text-align: center;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            font-size: 2.5rem;
            color: #2C3E50;
            margin-bottom: 20px;
        }

        .game-over .final-score {
            font-size: 4rem;
            font-weight: 700;
            color: #4ECDC4;
            margin: 20px 0;
        }

        .game-over .subtitle {
            font-size: 1.3rem;
            color: #7F8C8D;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 id="title">Tap Battle</h1>
            <p class="description" id="description">Tap as many times as you can!</p>
            <div class="timer" id="timer">10</div>
        </div>

        <div id="game-content">
            <div class="tap-zone" id="tap-zone">
                <div class="tap-instruction">
                    TAP HERE!<br>
                    <span style="font-size: 1.5rem;">Go as fast as you can!</span>
                </div>
            </div>

            <div class="score">
                Taps: <span id="score">0</span>
            </div>
        </div>

        <div class="game-over" id="game-over">
            <h2>Time's Up!</h2>
            <div class="final-score" id="final-score">0</div>
            <p class="subtitle">Taps in total</p>
        </div>
    </div>

    <script>
        // Get query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');
        const participantId = urlParams.get('participantId');
        const awardId = urlParams.get('awardId');
        const timeLimit = parseInt(urlParams.get('timeLimit')) || 10;
        const title = urlParams.get('title') || 'Tap Battle';
        const description = urlParams.get('description') || 'Tap as many times as you can!';

        // Update UI
        document.getElementById('title').textContent = title;
        document.getElementById('description').textContent = description;

        // Game state
        let score = 0;
        let timeLeft = timeLimit;
        let gameActive = true;

        const tapZone = document.getElementById('tap-zone');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');

        // Timer
        const timerInterval = setInterval(() => {
            if (timeLeft > 0 && gameActive) {
                timeLeft--;
                timerElement.textContent = timeLeft;

                if (timeLeft <= 5) {
                    timerElement.classList.add('warning');
                }
            } else {
                endGame();
            }
        }, 1000);

        // Handle taps
        tapZone.addEventListener('click', (e) => {
            if (!gameActive) return;

            score++;
            scoreElement.textContent = score;

            // Create ripple effect
            const ripple = document.createElement('div');
            ripple.className = 'tap-effect';
            ripple.style.left = e.offsetX - 30 + 'px';
            ripple.style.top = e.offsetY - 30 + 'px';
            tapZone.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 600);
        });

        // Also handle touch events for mobile
        tapZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameActive) return;

            const touch = e.touches[0];
            const rect = tapZone.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            score++;
            scoreElement.textContent = score;

            // Create ripple effect
            const ripple = document.createElement('div');
            ripple.className = 'tap-effect';
            ripple.style.left = x - 30 + 'px';
            ripple.style.top = y - 30 + 'px';
            tapZone.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 600);
        });

        async function endGame() {
            gameActive = false;
            clearInterval(timerInterval);

            document.getElementById('game-content').style.display = 'none';
            document.getElementById('game-over').classList.add('show');
            document.getElementById('final-score').textContent = score;

            // Save score to API
            try {
                const response = await fetch(`/api/rooms/${roomId}/votes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        participantId: participantId,
                        awardId: awardId,
                        answer: score.toString(),
                        timeSpent: timeLimit - timeLeft,
                        isCorrect: true
                    })
                });

                if (response.ok) {
                    console.log('Score saved successfully');

                    // Show results for 2 seconds, then notify parent to move to next
                    setTimeout(() => {
                        window.parent.postMessage({
                            type: 'GAME_COMPLETE',
                            score: score,
                            timeSpent: timeLimit - timeLeft
                        }, '*');
                    }, 2000);
                } else {
                    // Even if save failed, still advance after showing results
                    setTimeout(() => {
                        window.parent.postMessage({
                            type: 'GAME_COMPLETE',
                            score: score
                        }, '*');
                    }, 2000);
                }
            } catch (error) {
                console.error('Error saving score:', error);
                // Even on error, advance after delay
                setTimeout(() => {
                    window.parent.postMessage({
                        type: 'GAME_COMPLETE',
                        score: score
                    }, '*');
                }, 2000);
            }
        }
    </script>
</body>
</html>
