<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/games/game-api.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFE5D9 0%, #D4F1F4 50%, #FFFACD 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2C3E50;
            margin-bottom: 10px;
        }

        .description {
            font-size: 1.2rem;
            color: #7F8C8D;
            margin-bottom: 20px;
        }

        .round-info {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #FF6B6B, #FF8C42);
            color: white;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .reflex-zone {
            margin: 30px 0;
            height: 400px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
            position: relative;
        }

        .reflex-zone.waiting {
            background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
        }

        .reflex-zone.ready {
            background: linear-gradient(135deg, #2ECC71 0%, #27AE60 100%);
        }

        .reflex-zone.early {
            background: linear-gradient(135deg, #F39C12 0%, #E67E22 100%);
        }

        .zone-text {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            text-align: center;
            pointer-events: none;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            padding: 20px;
            background: #F8F9FA;
            border-radius: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #FF6B6B;
        }

        .stat-label {
            font-size: 1rem;
            color: #7F8C8D;
            font-weight: 600;
            margin-top: 5px;
        }

        .score {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2C3E50;
            margin-top: 20px;
        }

        .score span {
            color: #FF6B6B;
            font-size: 2rem;
        }

        .game-over {
            display: none;
            text-align: center;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            font-size: 2.5rem;
            color: #2C3E50;
            margin-bottom: 20px;
        }

        .game-over .final-score {
            font-size: 3rem;
            font-weight: 700;
            color: #FF6B6B;
            margin: 20px 0;
        }

        .game-over .subtitle {
            font-size: 1.3rem;
            color: #7F8C8D;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 id="title">Reflex Test</h1>
            <p class="description" id="description">Click when it turns green!</p>
            <div class="round-info" id="round-info">Round 1 of 5</div>
        </div>

        <div id="game-content">
            <div class="reflex-zone waiting" id="reflex-zone">
                <div class="zone-text" id="zone-text">
                    Wait for green...
                </div>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="avg-time">-</div>
                    <div class="stat-label">Avg Reaction (ms)</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="best-time">-</div>
                    <div class="stat-label">Best Time (ms)</div>
                </div>
            </div>

            <div class="score">
                Score: <span id="score">0</span>
            </div>
        </div>

        <div class="game-over" id="game-over">
            <h2>Complete!</h2>
            <div class="final-score" id="final-score">0</div>
            <p class="subtitle">Average reaction time (ms)</p>
        </div>
    </div>

    <script>
        // Get query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');
        const participantId = urlParams.get('participantId');
        const awardId = urlParams.get('awardId');
        const title = urlParams.get('title') || 'Reflex Test';
        const description = urlParams.get('description') || 'Click when it turns green!';

        // Initialize Game API
        const gameAPI = new GameAPI(roomId, participantId, awardId, 'reflex-test');

        // Update UI
        document.getElementById('title').textContent = title;
        document.getElementById('description').textContent = description;

        // Game state
        let score = 0;
        let round = 1;
        const maxRounds = 5;
        let startTime = 0;
        let isWaiting = false;
        let reactionTimes = [];
        let gameActive = false;
        let timeout = null;

        const zone = document.getElementById('reflex-zone');
        const zoneText = document.getElementById('zone-text');

        // Start first round
        setTimeout(() => {
            startRound();
        }, 1500);

        function startRound() {
            document.getElementById('round-info').textContent = `Round ${round} of ${maxRounds}`;

            zone.className = 'reflex-zone waiting';
            zoneText.textContent = 'Wait for green...';
            isWaiting = true;
            gameActive = false;

            // Random delay between 2-5 seconds
            const delay = 2000 + Math.random() * 3000;

            timeout = setTimeout(() => {
                zone.className = 'reflex-zone ready';
                zoneText.textContent = 'CLICK NOW!';
                startTime = Date.now();
                isWaiting = false;
                gameActive = true;
            }, delay);
        }

        zone.addEventListener('click', () => {
            if (isWaiting) {
                // Clicked too early
                clearTimeout(timeout);
                zone.className = 'reflex-zone early';
                zoneText.textContent = 'Too early! Wait for green';
                isWaiting = false;

                setTimeout(() => {
                    startRound();
                }, 1500);
            } else if (gameActive) {
                // Valid click
                gameActive = false;
                const reactionTime = Date.now() - startTime;
                reactionTimes.push(reactionTime);

                // Calculate score (faster = more points, max 100 per round)
                const points = Math.max(10, Math.floor(100 - (reactionTime / 10)));
                score += points;

                zoneText.textContent = `${reactionTime}ms! +${points}`;
                updateStats();

                setTimeout(() => {
                    round++;
                    if (round <= maxRounds) {
                        startRound();
                    } else {
                        endGame();
                    }
                }, 1500);
            }
        });

        function updateStats() {
            document.getElementById('score').textContent = score;

            const avgTime = Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length);
            document.getElementById('avg-time').textContent = avgTime;

            const bestTime = Math.min(...reactionTimes);
            document.getElementById('best-time').textContent = bestTime;
        }

        async function endGame() {
            const avgTime = Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length);
            const bestTime = Math.min(...reactionTimes);

            document.getElementById('game-content').style.display = 'none';
            document.getElementById('game-over').classList.add('show');
            document.getElementById('final-score').textContent = avgTime;

            // Submit score with detailed metrics using Game API
            await gameAPI.completeGame({
                score: score,
                metrics: {
                    avgReactionTime: avgTime,
                    bestReactionTime: bestTime,
                    reactionTimes: reactionTimes,
                    roundsCompleted: reactionTimes.length
                },
                timeSpent: 0
            }, 2000);
        }
    </script>
</body>
</html>
