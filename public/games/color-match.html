<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFE5D9 0%, #D4F1F4 50%, #FFFACD 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2C3E50;
            margin-bottom: 10px;
        }

        .description {
            font-size: 1.2rem;
            color: #7F8C8D;
            margin-bottom: 20px;
        }

        .timer {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #FF6B6B, #FF8C42);
            color: white;
            border-radius: 50px;
            font-size: 2rem;
            font-weight: 700;
            min-width: 100px;
        }

        .timer.warning {
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .target-color {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: #F8F9FA;
            border-radius: 15px;
        }

        .target-color h2 {
            font-size: 1.5rem;
            color: #2C3E50;
            margin-bottom: 10px;
        }

        .target-color-display {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.8rem;
            font-weight: 700;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .color-box {
            aspect-ratio: 1;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 4px solid transparent;
        }

        .color-box:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .color-box:active {
            transform: scale(0.95);
        }

        .score {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2C3E50;
            margin-top: 20px;
        }

        .score span {
            color: #4ECDC4;
            font-size: 2rem;
        }

        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 1000;
            transition: transform 0.3s;
        }

        .feedback.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .feedback.correct {
            border: 5px solid #2ECC71;
        }

        .feedback.wrong {
            border: 5px solid #E74C3C;
        }

        .feedback h2 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .feedback.correct h2 {
            color: #2ECC71;
        }

        .feedback.wrong h2 {
            color: #E74C3C;
        }

        .game-over {
            display: none;
            text-align: center;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            font-size: 2.5rem;
            color: #2C3E50;
            margin-bottom: 20px;
        }

        .game-over .final-score {
            font-size: 3rem;
            font-weight: 700;
            color: #4ECDC4;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 id="title">Color Match</h1>
            <p class="description" id="description">Tap the correct color as fast as you can!</p>
            <div class="timer" id="timer">10</div>
        </div>

        <div id="game-content">
            <div class="target-color">
                <h2>Find this color:</h2>
                <div class="target-color-display" id="target-color-display">RED</div>
            </div>

            <div class="color-grid" id="color-grid"></div>

            <div class="score">
                Score: <span id="score">0</span>
            </div>
        </div>

        <div class="game-over" id="game-over">
            <h2>Time's Up!</h2>
            <div class="final-score" id="final-score">0</div>
            <p>Points earned</p>
        </div>
    </div>

    <div class="feedback" id="feedback">
        <h2 id="feedback-text">Correct!</h2>
    </div>

    <script>
        // Get query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');
        const participantId = urlParams.get('participantId');
        const awardId = urlParams.get('awardId');
        const timeLimit = parseInt(urlParams.get('timeLimit')) || 10;
        const title = urlParams.get('title') || 'Color Match';
        const description = urlParams.get('description') || 'Tap the correct color as fast as you can!';

        // Update UI
        document.getElementById('title').textContent = title;
        document.getElementById('description').textContent = description;

        // Game state
        let score = 0;
        let timeLeft = timeLimit;
        let gameActive = true;
        let currentTargetColor = '';

        const colors = [
            { name: 'RED', value: '#E74C3C' },
            { name: 'BLUE', value: '#3498DB' },
            { name: 'GREEN', value: '#2ECC71' },
            { name: 'YELLOW', value: '#F1C40F' },
            { name: 'PURPLE', value: '#9B59B6' },
            { name: 'ORANGE', value: '#FF8C42' },
            { name: 'PINK', value: '#FF6B9D' },
            { name: 'CYAN', value: '#4ECDC4' },
            { name: 'BROWN', value: '#A0826D' }
        ];

        // Timer
        const timerElement = document.getElementById('timer');
        const timerInterval = setInterval(() => {
            if (timeLeft > 0 && gameActive) {
                timeLeft--;
                timerElement.textContent = timeLeft;

                if (timeLeft <= 5) {
                    timerElement.classList.add('warning');
                }
            } else {
                endGame();
            }
        }, 1000);

        // Generate color grid
        function generateColors() {
            const targetIndex = Math.floor(Math.random() * colors.length);
            currentTargetColor = colors[targetIndex];

            // Display target color
            const targetDisplay = document.getElementById('target-color-display');
            targetDisplay.textContent = currentTargetColor.name;
            targetDisplay.style.background = currentTargetColor.value;
            targetDisplay.style.color = getContrastColor(currentTargetColor.value);

            // Create color grid with target and random colors
            const colorGrid = document.getElementById('color-grid');
            colorGrid.innerHTML = '';

            const gridColors = [...colors].sort(() => Math.random() - 0.5).slice(0, 9);
            if (!gridColors.find(c => c.name === currentTargetColor.name)) {
                gridColors[Math.floor(Math.random() * gridColors.length)] = currentTargetColor;
            }

            gridColors.forEach(color => {
                const box = document.createElement('div');
                box.className = 'color-box';
                box.style.background = color.value;
                box.dataset.colorName = color.name;
                box.addEventListener('click', () => handleColorClick(color.name));
                colorGrid.appendChild(box);
            });
        }

        function getContrastColor(hexColor) {
            const r = parseInt(hexColor.substr(1,2), 16);
            const g = parseInt(hexColor.substr(3,2), 16);
            const b = parseInt(hexColor.substr(5,2), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 155 ? '#000000' : '#FFFFFF';
        }

        function handleColorClick(colorName) {
            if (!gameActive) return;

            const feedback = document.getElementById('feedback');
            const feedbackText = document.getElementById('feedback-text');

            if (colorName === currentTargetColor.name) {
                // Correct
                score += 10;
                document.getElementById('score').textContent = score;

                feedback.className = 'feedback correct show';
                feedbackText.textContent = 'Correct! +10';

                setTimeout(() => {
                    feedback.classList.remove('show');
                    generateColors();
                }, 500);
            } else {
                // Wrong
                feedback.className = 'feedback wrong show';
                feedbackText.textContent = 'Wrong!';

                setTimeout(() => {
                    feedback.classList.remove('show');
                }, 500);
            }
        }

        async function endGame() {
            gameActive = false;
            clearInterval(timerInterval);

            document.getElementById('game-content').style.display = 'none';
            document.getElementById('game-over').classList.add('show');
            document.getElementById('final-score').textContent = score;

            // Save score to API
            try {
                const response = await fetch(`/api/rooms/${roomId}/votes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        participantId: participantId,
                        awardId: awardId,
                        answer: score.toString(),
                        timeSpent: timeLimit - timeLeft,
                        isCorrect: true
                    })
                });

                if (response.ok) {
                    console.log('Score saved successfully');

                    // Show results for 2 seconds, then notify parent to move to next
                    setTimeout(() => {
                        window.parent.postMessage({
                            type: 'GAME_COMPLETE',
                            score: score,
                            timeSpent: timeLimit - timeLeft
                        }, '*');
                    }, 2000);
                } else {
                    // Even if save failed, still advance after showing results
                    setTimeout(() => {
                        window.parent.postMessage({
                            type: 'GAME_COMPLETE',
                            score: score
                        }, '*');
                    }, 2000);
                }
            } catch (error) {
                console.error('Error saving score:', error);
                // Even on error, advance after delay
                setTimeout(() => {
                    window.parent.postMessage({
                        type: 'GAME_COMPLETE',
                        score: score
                    }, '*');
                }, 2000);
            }
        }

        // Initialize game
        generateColors();
    </script>
</body>
</html>
