<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Race</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFE5D9 0%, #D4F1F4 50%, #FFFACD 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2C3E50;
            margin-bottom: 10px;
        }

        .description {
            font-size: 1.2rem;
            color: #7F8C8D;
            margin-bottom: 20px;
        }

        .timer {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #FF6B6B, #FF8C42);
            color: white;
            border-radius: 50px;
            font-size: 2rem;
            font-weight: 700;
            min-width: 100px;
        }

        .timer.warning {
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .word-display {
            margin: 30px 0;
            padding: 30px;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            border-radius: 20px;
            text-align: center;
        }

        .target-word {
            font-size: 3rem;
            font-weight: 700;
            color: white;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-area {
            margin: 30px 0;
        }

        .word-input {
            width: 100%;
            padding: 20px;
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            border: 4px solid #E0E0E0;
            border-radius: 15px;
            outline: none;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .word-input:focus {
            border-color: #667EEA;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .word-input.correct {
            border-color: #2ECC71;
            background: #D5F5E3;
        }

        .word-input.wrong {
            border-color: #E74C3C;
            background: #FADBD8;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .score {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2C3E50;
            margin-top: 20px;
        }

        .score span {
            color: #667EEA;
            font-size: 2rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            padding: 15px;
            background: #F8F9FA;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667EEA;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #7F8C8D;
            font-weight: 600;
            margin-top: 5px;
        }

        .game-over {
            display: none;
            text-align: center;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            font-size: 2.5rem;
            color: #2C3E50;
            margin-bottom: 20px;
        }

        .game-over .final-score {
            font-size: 3rem;
            font-weight: 700;
            color: #667EEA;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 id="title">Word Race</h1>
            <p class="description" id="description">Type the words as fast as you can!</p>
            <div class="timer" id="timer">30</div>
        </div>

        <div id="game-content">
            <div class="word-display">
                <div class="target-word" id="target-word">READY</div>
            </div>

            <div class="input-area">
                <input
                    type="text"
                    id="word-input"
                    class="word-input"
                    placeholder="TYPE HERE"
                    autocomplete="off"
                    spellcheck="false"
                />
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="words-typed">0</div>
                    <div class="stat-label">Words Typed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="accuracy">100%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
            </div>

            <div class="score">
                Score: <span id="score">0</span>
            </div>
        </div>

        <div class="game-over" id="game-over">
            <h2>Time's Up!</h2>
            <div class="final-score" id="final-score">0</div>
            <p>Words per minute</p>
        </div>
    </div>

    <script>
        // Get query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');
        const participantId = urlParams.get('participantId');
        const awardId = urlParams.get('awardId');
        const timeLimit = parseInt(urlParams.get('timeLimit')) || 30;
        const title = urlParams.get('title') || 'Word Race';
        const description = urlParams.get('description') || 'Type the words as fast as you can!';

        // Update UI
        document.getElementById('title').textContent = title;
        document.getElementById('description').textContent = description;
        document.getElementById('timer').textContent = timeLimit;

        // Word list
        const words = [
            'QUICK', 'BROWN', 'JUMPS', 'OVER', 'LAZY', 'DOG', 'HELLO', 'WORLD',
            'SPEED', 'RACE', 'TYPE', 'FAST', 'WORD', 'GAME', 'PLAY', 'TIME',
            'CODE', 'DATA', 'FIRE', 'LIGHT', 'STAR', 'MOON', 'SUN', 'SKY',
            'WIND', 'RAIN', 'SNOW', 'CLOUD', 'TREE', 'LEAF', 'FLOWER', 'ROCK',
            'WATER', 'OCEAN', 'RIVER', 'LAKE', 'MOUNTAIN', 'HILL', 'VALLEY',
            'BIRD', 'FISH', 'BEAR', 'WOLF', 'LION', 'TIGER', 'EAGLE', 'HAWK'
        ];

        // Game state
        let score = 0;
        let timeLeft = timeLimit;
        let gameActive = false;
        let currentWord = '';
        let wordsTyped = 0;
        let correctWords = 0;
        let attempts = 0;

        const input = document.getElementById('word-input');
        const targetWordEl = document.getElementById('target-word');
        const timerElement = document.getElementById('timer');

        // Start game after 2 seconds
        setTimeout(() => {
            gameActive = true;
            generateWord();
            input.focus();
            startTimer();
        }, 2000);

        function startTimer() {
            const timerInterval = setInterval(() => {
                if (timeLeft > 0 && gameActive) {
                    timeLeft--;
                    timerElement.textContent = timeLeft;

                    if (timeLeft <= 10) {
                        timerElement.classList.add('warning');
                    }
                } else {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function generateWord() {
            currentWord = words[Math.floor(Math.random() * words.length)];
            targetWordEl.textContent = currentWord;
            input.value = '';
            input.className = 'word-input';
        }

        input.addEventListener('input', (e) => {
            if (!gameActive) return;

            const typed = e.target.value.toUpperCase();

            if (typed === currentWord) {
                // Correct!
                attempts++;
                correctWords++;
                wordsTyped++;
                score += 10;

                input.className = 'word-input correct';
                updateStats();

                setTimeout(() => {
                    generateWord();
                }, 200);
            } else if (typed.length >= currentWord.length) {
                // Wrong - typed too many characters
                attempts++;
                input.className = 'word-input wrong';
                updateStats();

                setTimeout(() => {
                    generateWord();
                }, 500);
            }
        });

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('words-typed').textContent = wordsTyped;

            const accuracy = attempts > 0 ? Math.round((correctWords / attempts) * 100) : 100;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        async function endGame() {
            gameActive = false;

            // Calculate WPM
            const minutesElapsed = (timeLimit - timeLeft) / 60;
            const wpm = minutesElapsed > 0 ? Math.round(wordsTyped / minutesElapsed) : 0;

            document.getElementById('game-content').style.display = 'none';
            document.getElementById('game-over').classList.add('show');
            document.getElementById('final-score').textContent = wpm;

            // Save score to API
            try {
                const response = await fetch(`/api/rooms/${roomId}/votes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        participantId: participantId,
                        awardId: awardId,
                        answer: score.toString(),
                        timeSpent: timeLimit - timeLeft,
                        isCorrect: true
                    })
                });

                if (response.ok) {
                    console.log('Score saved successfully');

                    // Show results for 2 seconds, then notify parent to move to next
                    setTimeout(() => {
                        window.parent.postMessage({
                            type: 'GAME_COMPLETE',
                            score: score,
                            wpm: wpm,
                            timeSpent: timeLimit - timeLeft
                        }, '*');
                    }, 2000);
                } else {
                    // Even if save failed, still advance after showing results
                    setTimeout(() => {
                        window.parent.postMessage({
                            type: 'GAME_COMPLETE',
                            score: score
                        }, '*');
                    }, 2000);
                }
            } catch (error) {
                console.error('Error saving score:', error);
                // Even on error, advance after delay
                setTimeout(() => {
                    window.parent.postMessage({
                        type: 'GAME_COMPLETE',
                        score: score
                    }, '*');
                }, 2000);
            }
        }
    </script>
</body>
</html>
