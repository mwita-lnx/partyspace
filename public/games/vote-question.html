<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFE5D9 0%, #D4F1F4 50%, #FFFACD 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
        }

        @media (min-width: 640px) {
            .game-container {
                border-radius: 20px;
                padding: 30px;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2C3E50;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        @media (min-width: 640px) {
            h1 {
                font-size: 2rem;
            }
        }

        .description {
            font-size: 0.9rem;
            color: #7F8C8D;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        @media (min-width: 640px) {
            .description {
                font-size: 1.1rem;
            }
        }

        .timer {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, #FF6B6B, #FF8C42);
            color: white;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 700;
            min-width: 80px;
        }

        @media (min-width: 640px) {
            .timer {
                padding: 15px 30px;
                font-size: 2rem;
                min-width: 100px;
            }
        }

        .timer.warning {
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2C3E50;
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #F8F9FA;
            border-radius: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        @media (min-width: 640px) {
            .question-text {
                font-size: 1.6rem;
                margin: 30px 0;
                padding: 20px;
            }
        }

        .options-container {
            margin: 30px 0;
        }

        .option-btn {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            border: 2px solid #E0E0E0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            color: #2C3E50;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        @media (min-width: 640px) {
            .option-btn {
                padding: 18px;
                margin-bottom: 15px;
                font-size: 1.2rem;
                border: 3px solid #E0E0E0;
                border-radius: 15px;
                gap: 15px;
            }
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            border-color: #4ECDC4;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.selected {
            background: linear-gradient(135deg, #4ECDC4 0%, #44A8AC 100%);
            color: white;
            border-color: #4ECDC4;
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #2ECC71 0%, #27AE60 100%);
            color: white;
            border-color: #2ECC71;
        }

        .option-btn.wrong {
            background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
            color: white;
            border-color: #E74C3C;
        }

        .option-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .option-letter {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
        }

        .option-btn.selected .option-letter,
        .option-btn.correct .option-letter,
        .option-btn.wrong .option-letter {
            background: rgba(255, 255, 255, 0.3);
        }

        .feedback-area {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            display: none;
        }

        @media (min-width: 640px) {
            .feedback-area {
                margin-top: 20px;
                padding: 20px;
                border-radius: 15px;
                font-size: 1.3rem;
            }
        }

        .feedback-area.show {
            display: block;
        }

        .feedback-area.correct {
            background: #D5F5E3;
            color: #27AE60;
        }

        .feedback-area.wrong {
            background: #FADBD8;
            color: #C0392B;
        }

        .feedback-area.voted {
            background: #D6EAF8;
            color: #2980B9;
        }

        .game-over {
            display: none;
            text-align: center;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            font-size: 2.5rem;
            color: #2C3E50;
            margin-bottom: 20px;
        }

        .game-over .message {
            font-size: 1.5rem;
            color: #7F8C8D;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 id="title">Question</h1>
            <p class="description" id="description">Choose your answer</p>
            <div class="timer" id="timer" style="display: none;">30</div>
        </div>

        <div id="game-content">
            <div class="question-text" id="question-text">
                Loading question...
            </div>

            <div class="options-container" id="options-container"></div>

            <div class="feedback-area" id="feedback"></div>
        </div>

        <div class="game-over" id="game-over">
            <h2>Answer Submitted!</h2>
            <p class="message">Moving to next question...</p>
        </div>
    </div>

    <script>
        // Get query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');
        const participantId = urlParams.get('participantId');
        const awardId = urlParams.get('awardId');
        const timeLimit = parseInt(urlParams.get('timeLimit')) || 0;
        const title = urlParams.get('title') || 'Question';
        const description = urlParams.get('description') || 'Choose your answer';
        const correctAnswer = urlParams.get('correctAnswer') || null;

        // Parse options from JSON string
        let options = [];
        try {
            const optionsParam = urlParams.get('options');
            if (optionsParam) {
                options = JSON.parse(decodeURIComponent(optionsParam));
            }
        } catch (error) {
            console.error('Error parsing options:', error);
            options = ['Option 1', 'Option 2', 'Option 3', 'Option 4'];
        }

        // Update UI
        document.getElementById('title').textContent = title;
        document.getElementById('description').textContent = description;
        document.getElementById('question-text').textContent = title;

        // Game state
        let timeLeft = timeLimit;
        let gameActive = true;
        let selectedAnswer = null;
        let answered = false;

        // Show timer if time limit exists
        const timerElement = document.getElementById('timer');
        if (timeLimit > 0) {
            timerElement.style.display = 'inline-block';
            timerElement.textContent = timeLeft;

            // Timer countdown
            const timerInterval = setInterval(() => {
                if (timeLeft > 0 && gameActive && !answered) {
                    timeLeft--;
                    timerElement.textContent = timeLeft;

                    if (timeLeft <= 10) {
                        timerElement.classList.add('warning');
                    }
                } else if (timeLeft === 0 && !answered) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        // Display options
        const optionsContainer = document.getElementById('options-container');
        options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `
                <div class="option-letter">${String.fromCharCode(65 + index)}</div>
                <span>${option}</span>
            `;
            btn.addEventListener('click', () => handleAnswer(option));
            optionsContainer.appendChild(btn);
        });

        function handleAnswer(answer) {
            if (answered || !gameActive) return;

            answered = true;
            selectedAnswer = answer;

            // Visual feedback
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                const btnText = btn.querySelector('span').textContent;

                if (correctAnswer) {
                    // For trivia/quiz games with correct answers
                    if (btnText === correctAnswer) {
                        btn.classList.add('correct');
                    } else if (btnText === answer) {
                        btn.classList.add('wrong');
                    }
                } else {
                    // For voting/opinion games
                    if (btnText === answer) {
                        btn.classList.add('selected');
                    }
                }
            });

            // Show feedback
            const feedback = document.getElementById('feedback');
            if (correctAnswer) {
                if (answer === correctAnswer) {
                    feedback.className = 'feedback-area correct show';
                    feedback.textContent = 'Correct! Well done!';
                } else {
                    feedback.className = 'feedback-area wrong show';
                    feedback.textContent = `Wrong! The correct answer was: ${correctAnswer}`;
                }
            } else {
                feedback.className = 'feedback-area voted show';
                feedback.textContent = 'Vote recorded!';
            }

            // Submit answer
            submitAnswer();
        }

        function handleTimeout() {
            answered = true;
            gameActive = false;

            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback-area wrong show';
            feedback.textContent = 'Time\'s up!';

            setTimeout(() => {
                finishGame();
            }, 2000);
        }

        async function submitAnswer() {
            try {
                const isCorrect = correctAnswer ? (selectedAnswer === correctAnswer) : undefined;
                const points = isCorrect ? Math.ceil((timeLeft / timeLimit) * 100) || 100 : 0;

                const response = await fetch(`/api/rooms/${roomId}/votes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        participantId: participantId,
                        awardId: awardId,
                        nominee: selectedAnswer,
                        answer: selectedAnswer,
                        timeSpent: timeLimit > 0 ? timeLimit - timeLeft : 0,
                        isCorrect: isCorrect
                    })
                });

                if (response.ok) {
                    console.log('Answer saved successfully');

                    // Show feedback for 2 seconds, then notify parent to move to next
                    setTimeout(() => {
                        // Notify parent window to advance
                        window.parent.postMessage({
                            type: 'GAME_COMPLETE',
                            answer: selectedAnswer,
                            isCorrect: correctAnswer ? (selectedAnswer === correctAnswer) : undefined,
                            timeSpent: timeLimit > 0 ? timeLimit - timeLeft : 0
                        }, '*');
                    }, 2000);
                } else {
                    console.error('Failed to save answer');
                    // Even if save failed, still advance after showing error
                    setTimeout(() => {
                        window.parent.postMessage({
                            type: 'GAME_COMPLETE',
                            answer: selectedAnswer
                        }, '*');
                    }, 2000);
                }
            } catch (error) {
                console.error('Error saving answer:', error);
                // Even on error, advance after delay
                setTimeout(() => {
                    window.parent.postMessage({
                        type: 'GAME_COMPLETE',
                        answer: selectedAnswer
                    }, '*');
                }, 2000);
            }
        }
    </script>
</body>
</html>
